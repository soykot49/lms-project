services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-your-secret-key-here-change-in-production"
      DATABASE_URL: "postgresql://lms_user:lms_password@db:5432/lms_db"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  # Celery Worker (executes tasks queued by Beat)
  celery:
    build: ./backend
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-your-secret-key-here-change-in-production"
      DATABASE_URL: "postgresql://lms_user:lms_password@db:5432/lms_db"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      REMINDER_TASK_HOUR: "9"
      REMINDER_TASK_MINUTE: "0"
      OVERDUE_TASK_HOUR: "10"
      OVERDUE_TASK_MINUTE: "0"
      RESERVATION_TASK_HOUR: "11"
      RESERVATION_TASK_MINUTE: "0"
      OVERDUE_EVENING_TASK_HOUR: "18"
      OVERDUE_EVENING_TASK_MINUTE: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Celery Beat — crontab from config/beat_schedule.py (CELERY_BEAT_SCHEDULE)
  celery-beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-your-secret-key-here-change-in-production"
      DATABASE_URL: "postgresql://lms_user:lms_password@db:5432/lms_db"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      REMINDER_TASK_HOUR: "9"
      REMINDER_TASK_MINUTE: "0"
      OVERDUE_TASK_HOUR: "10"
      OVERDUE_TASK_MINUTE: "0"
      RESERVATION_TASK_HOUR: "11"
      RESERVATION_TASK_MINUTE: "0"
      OVERDUE_EVENING_TASK_HOUR: "18"
      OVERDUE_EVENING_TASK_MINUTE: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      celery:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Frontend (Vite build + Nginx — proxies /api and /ws to backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
